name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Publishing the release-drafter draft creates the tag and releases: main-green first waits for main's run of this
  # workflow on the released commit to have passed. nuget.org's and npm's trusted publishing name this file, so
  # releasing stays here.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

# macOS runners are severely constrained: macOS jobs run only on a push to main, plus the osx-arm64 AOT pack on a
# release (macOS AOT only compiles on macOS). A release runs no tests of its own; main-green requires main's full run,
# macOS included, to have passed on the released commit, and every release job needs it.
jobs:
  # A release ships a commit main has already proven: wait for main's push run of ci.yml on the released commit and
  # stop unless it passed.
  main-green:
    if: github.event_name == 'release'
    name: main is green
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read # read main's ci.yml runs
    steps:
      - uses: nullean/.github/actions/require-green-main@f9eb30d28e48b3f6b8ff1f4e7dae1d2b7b2d544b # v1.6.0

  journeys-js:
    if: github.event_name != 'release' # publish-npm builds and tests the package itself
    runs-on: ubuntu-latest
    name: "@nullean/journeys (node)"
    timeout-minutes: 15
    defaults:
      run:
        working-directory: js/journeys

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node comes from mise.toml, as it does locally; this job needs nothing else from it.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
          cache: false # this workflow publishes what its jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # What would be published: the compiled package and nothing else (no sources, tests or lockfile).
      - name: Pack (dry run)
        run: npm pack --dry-run

      # The parser is checked against the .NET one (fixtures and the JSON `cdp parse` prints) and the runner against a
      # real Chrome; the Linux runner has Chrome installed.
      - name: Test
        env:
          CDP_BROWSER_REQUIRED: "1"
        run: |
          npm test
          npm run test:live

  # On a release only the Linux leg runs, and only to pack the libraries the release job publishes: the checks and
  # tests ran in main's push run on this commit.
  build:
    needs: main-green
    # main-green is skipped on everything but a release, which would skip this job too without a status function.
    if: ${{ !cancelled() && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            (github.event_name == 'push' && '["ubuntu-latest", "windows-latest", "macos-latest"]')
            || (github.event_name == 'release' && '["ubuntu-latest"]')
            || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Build
        run: dotnet build -c Release

      - name: Check formatting (curb)
        if: github.event_name != 'release'
        run: dotnet tool restore && dotnet curb check .

      # Fast PR checks: the browser suite runs on Linux; macOS and Windows build and run the tests that need no
      # browser. (On the small macOS runners a full browser suite with auto-attach made the runner unresponsive.)
      - name: Test
        if: github.event_name != 'release'
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export CDP_BROWSER_REQUIRED=1; else export CDP_SKIP_BROWSER=1; fi
          dotnet test -c Release --no-build

      # The CLI is a RID-specific tool and is packed by the jobs below; --no-build cannot pack it.
      - name: Pack the libraries
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            case "$project" in *Nullean.Cdp.Cli*) continue ;; esac
            dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
          done
          ls .artifacts/package-output

      - name: Upload the library packages
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-libraries
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # Native AOT cannot cross-compile between operating systems, so each RID packs on a matching runner. osx-arm64 runs
  # on a push to main and on a release, where it is the one macOS job; workflow_dispatch packs the other four.
  aot-pack:
    needs: main-green
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
        && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'push' || github.event_name == 'release')
            && '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"},{"rid":"osx-arm64","runner":"macos-latest"}]'
            || '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    name: AOT pack (${{ matrix.rid }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack the native tool for ${{ matrix.rid }}
        run: dotnet pack src/Nullean.Cdp.Cli -c Release -r ${{ matrix.rid }} -o .artifacts/package-output

      - name: Report the native binary size
        shell: bash
        run: |
          EXT=""
          [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          BINARY=$(find .artifacts/bin/Nullean.Cdp.Cli -path "*release_${{ matrix.rid }}/native/cdp${EXT}" -type f | head -1)
          [[ -n "$BINARY" ]] || { echo "no native binary found"; exit 1; }
          ls -la "$BINARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-cli-${{ matrix.rid }}
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # A plain pack emits the root package, the portable 'any' fallback and managed per-RID packages. Only the first two
  # are kept: the real per-RID packages are the AOT ones above.
  tool-pack:
    needs: main-green
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
        && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    runs-on: ubuntu-latest
    name: Pack the root and portable tool packages
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack
        run: |
          dotnet pack src/Nullean.Cdp.Cli -c Release -o .artifacts/cli-staging
          mkdir -p .artifacts/package-output
          for package in .artifacts/cli-staging/*.nupkg; do
            name="$(basename "$package")"
            case "$name" in
              Nullean.Cdp.Cli.linux-*|Nullean.Cdp.Cli.win-*|Nullean.Cdp.Cli.osx-*) echo "dropping $name" ;;
              *) echo "keeping $name"; cp "$package" .artifacts/package-output/ ;;
            esac
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-cli-root
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # Installs the packed tool from a local feed and runs the smoke test with it, installed and through dnx. Not on a
  # release, which relies on main's run of it; macOS only on a push to main.
  tool-smoke:
    if: github.event_name != 'release'
    needs: [aot-pack, tool-pack]
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'push'
            && '["ubuntu-latest", "windows-latest", "macos-latest"]'
            || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    name: Tool smoke test (${{ matrix.os }})
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nupkg-cli-*
          path: ${{ runner.temp }}/feed
          merge-multiple: true

      # Outside the checkout: a nuget.config with package source mapping refuses --add-source.
      - name: Install and run
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          temp="$RUNNER_TEMP"
          cdp="cdp"
          # On Windows a RID-specific tool installs as a cdp.cmd shim, and Git Bash wants a POSIX path.
          if [[ "$RUNNER_OS" == "Windows" ]]; then temp="$(cygpath -u "$RUNNER_TEMP")"; cdp="cdp.cmd"; fi
          feed="$temp/feed"
          ls "$feed"
          # shellcheck disable=SC2012 # package file names are plain ASCII
          root="$(ls "$feed" | sed -n 's/^Nullean\.Cdp\.Cli\.\([0-9][^/]*\)\.nupkg$/\1/p')"
          [ -n "$root" ] || { echo "no root package in the feed"; exit 1; }
          echo "version $root"
          dotnet tool install Nullean.Cdp.Cli --tool-path "$temp/tool" --add-source "$feed" --version "$root"
          "$GITHUB_WORKSPACE/build/smoke-cli.sh" "$temp/tool/$cdp"
          "$GITHUB_WORKSPACE/build/smoke-cli.sh" dotnet dnx "Nullean.Cdp.Cli@$root" --add-source "$feed" --yes

  # Publishing to nuget.org: a published release (its tag X.Y.Z or X.Y.Z-pre.N) publishes, and only once main-green has
  # seen main's run on the released commit pass. Publishing the release-drafter draft is the release decision; pushing a tag alone does nothing.
  # A failed run can be re-run: pushing is skipped for packages already there. The 'release' environment only lets tags
  # deploy, and nuget.org's trusted publishing policy names it, so no API key is stored.
  release:
    if: github.event_name == 'release'
    needs: [main-green, build, aot-pack, tool-pack]
    runs-on: ubuntu-latest
    name: Publish to nuget.org
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # attach the packages to the release
      id-token: write   # trusted publishing: exchange the workflow's OIDC token for a short-lived key

    steps:
      # No checkout here, so no mise.toml: the action writes one with the SDK the push needs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # a release never restores a cache PR builds could have written
          mise_toml: |
            [tools]
            dotnet = "10"
        env:
          MISE_JOBS: "1"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nupkg-*
          path: packages
          merge-multiple: true

      - name: Check every package has the tag's version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          ls packages
          for package in packages/*.nupkg; do
            case "$(basename "$package")" in
              *".$version.nupkg") ;;
              *) echo "::error::$(basename "$package") does not have version $version"; exit 1 ;;
            esac
          done

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The root tool package points at the per-RID ones, so it goes last: nobody can install a root package whose
      # RID packages are not there yet.
      - name: Publish
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          push() {
            dotnet nuget push "$1" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
          root="packages/Nullean.Cdp.Cli.${GITHUB_REF_NAME}.nupkg"
          for package in packages/*.nupkg; do
            [ "$package" = "$root" ] || push "$package"
          done
          push "$root"

      # The release already exists (it is the published draft); attach the packages to it. After publishing, so the
      # attached packages are always the ones on nuget.org. --clobber makes a re-run safe.
      - name: Attach the packages to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber

  # The npm package is published like the NuGet ones: from a published release, in the `release` environment,
  # through trusted publishing (the workflow's OIDC token; no token is stored). The release's tag gives the version.
  # Only after main-green: journeys-js and the .NET build ran in main's push run on this commit.
  publish-npm:
    if: github.event_name == 'release'
    needs: main-green
    runs-on: ubuntu-latest
    name: Publish @nullean/journeys to npm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write   # trusted publishing: npm exchanges the workflow's OIDC token for a short-lived publish credential
    defaults:
      run:
        working-directory: js/journeys

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kept on setup-node: its registry-url writes the .npmrc that npm's trusted publishing is set up against.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into a publishing job

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          v="$(npm --version)"
          echo "npm $v"
          [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = "11.5.1" ] || { echo "::error::npm $v is older than 11.5.1"; exit 1; }

      - run: npm ci

      # package.json keeps a placeholder version; the tag is the version (0.1.0, 0.2.0-beta.1).
      - name: Version from the tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME}"

      - run: npm run build
      - run: npm test
        env:
          CDP_BROWSER_REQUIRED: "1"

      # A re-run on the same tag must not fail because the version is already there.
      - name: Publish
        shell: bash
        run: |
          name="$(npm pkg get name | tr -d '"')"
          if npm view "$name@${GITHUB_REF_NAME}" version >/dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME} is already on npm; nothing to publish."
            exit 0
          fi
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          # Provenance is automatic with trusted publishing from a public repository.
          npm publish --access public --tag "$tag"

  # Static analysis of these workflows (nullean/.github).
  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read
