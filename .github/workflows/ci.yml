name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # Fast PR checks: the browser suite runs on Linux; macOS and Windows build and run the tests that need no
      # browser. (On the small macOS runners a full browser suite with auto-attach made the runner unresponsive.)
      - name: Test
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export CDP_BROWSER_REQUIRED=1; else export CDP_SKIP_BROWSER=1; fi
          dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o .artifacts/package-output

      - name: Report the version
        shell: bash
        run: ls .artifacts/package-output
