name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20
    env:
      # GitHub's runner images ship Chrome; tests that need it fail rather than skip when it is missing.
      CDP_BROWSER_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # The macOS runner has hung in this step with no log kept (the step limit did not fire). A watchdog kills the
      # run after 8 minutes, the hang dump names the tests still running after 4, and the log is uploaded either way.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/test-results
          watchdog() {
            sleep 480
            echo "WATCHDOG: the test run took over 8 minutes; killing it" | tee -a .artifacts/test-results/test.log
            ps -axo pid,etime,command | grep -iE "dotnet|chrom" | grep -v grep | tee -a .artifacts/test-results/test.log || true
            pkill -f Nullean.Cdp.Tests || true
            pkill -f -i "chrom" || true
          }
          if command -v pkill > /dev/null; then watchdog & fi
          dotnet test -c Release --no-build --output Detailed --hangdump --hangdump-timeout 4m --hangdump-type Mini \
            --results-directory .artifacts/test-results 2>&1 | tee -a .artifacts/test-results/test.log
          status=$?
          for job in $(jobs -p); do kill "$job" 2> /dev/null || true; done
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .artifacts/test-results
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack -c Release --no-build -o .artifacts/package-output

      - name: Report the version
        shell: bash
        run: ls .artifacts/package-output
