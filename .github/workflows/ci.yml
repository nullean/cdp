name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20
    env:
      # GitHub's runner images ship Chrome; tests that need it fail rather than skip when it is missing.
      CDP_BROWSER_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # A hang dumps the test process after 5 minutes and names the tests still running; the step limit keeps the
      # job (and its log) alive when that is not enough.
      - name: Test
        timeout-minutes: 10
        run: dotnet test -c Release --no-build --output Detailed --hangdump --hangdump-timeout 5m --hangdump-type Mini --results-directory .artifacts/test-results

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .artifacts/test-results
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack -c Release --no-build -o .artifacts/package-output

      - name: Report the version
        shell: bash
        run: ls .artifacts/package-output
