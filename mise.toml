# Bootstraps the toolchain and is the one entry point: `mise run <task>`, the same task names in every nullean repo.
# The .NET SDK version lives only in global.json: the first dotnet entry reads it from there (sdk.version is the first
# "version" key). The libraries also target net10.0, whose reference assemblies come from NuGet; nothing runs on the
# .NET 10 runtime, so it is not installed. Node is the version CI builds and tests @nullean/journeys (js/journeys) with.
#
# The tasks run the commands CI runs; there is no build project. Browser tests need a local Chrome: without one they
# skip (CI sets CDP_BROWSER_REQUIRED=1 on Linux so they fail instead).

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = ["""{{ read_file(path='global.json') | split(pat='"version"') | nth(n=1) | split(pat='"') | nth(n=1) }}"""]
node = "26"
gh = "latest"
zizmor = "1"

[tasks.setup]
description = "Restore the local .NET tools (curb)"
run = "dotnet tool restore"

[tasks.build]
description = "Build the solution"
run = "dotnet build -c Release"

[tasks.test]
description = "Build, then run the tests"
run = ["dotnet build -c Release", "dotnet test -c Release --no-build"]

[tasks.format]
description = "Format the repository with curb"
depends = ["setup"]
run = "dotnet curb format ."

[tasks.check]
description = "Fail on formatting drift (curb) and on workflow findings (zizmor)"
depends = ["setup"]
run = ["dotnet curb check .", "zizmor --min-severity medium ."]

[tasks.pack]
description = "Build and pack the libraries, as CI's build job does (the CLI is a native AOT tool CI packs per RID)"
run = [
  "dotnet build -c Release",
  '''
  for project in src/*/*.csproj; do
    case "$project" in *Nullean.Cdp.Cli*) continue ;; esac
    dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
  done
  ls .artifacts/package-output
  ''',
]

[tasks.docs]
description = "Build the documentation and serve it locally (needs docs-builder; see scripts/docs.sh)"
run = "scripts/docs.sh"

[tasks.ci]
description = "What CI runs on every push: the build job (build, curb check, test, pack the libraries) and the journeys-js job"
depends = ["setup"]
run = [
  "dotnet build -c Release",
  "dotnet curb check .",
  "dotnet test -c Release --no-build",
  '''
  for project in src/*/*.csproj; do
    case "$project" in *Nullean.Cdp.Cli*) continue ;; esac
    dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
  done
  ls .artifacts/package-output
  ''',
  "cd js/journeys && npm ci && npm run typecheck && npm run build && npm pack --dry-run && npm test && npm run test:live",
]

[tasks.release]
description = "Open the release-drafter draft; `mise run release publish` publishes it, which releases"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName')
if [ -z "$tag" ]; then
  echo "no draft release; merge a labelled pull request to main first" >&2
  exit 1
fi
if [ "${1:-}" = "publish" ]; then
  gh release edit "$tag" --draft=false
  echo "published $tag; the release workflow is now packing and pushing it"
else
  gh release view "$tag"
  echo
  echo "publish with: mise run release publish   (or promote the draft on github.com)"
fi
'''
