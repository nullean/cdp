<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Perf</title></head>
<body>
<main>
  <h1 id="hero">Performance fixture</h1>
  <p>Some text that is pushed down when the banner arrives.</p>
  <button type="button" onclick="const end = performance.now() + 80; while (performance.now() < end) {} this.textContent = 'Clicked'">Slow button</button>
</main>
<script>
  // A late banner at the top shifts everything below it: a layout shift without user input. Only once the page has
  // been painted: a change before the first frame moves nothing anyone saw, and is no shift.
  addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => {
    const banner = document.createElement('div');
    banner.style.height = '200px';
    banner.textContent = 'Late banner';
    document.body.prepend(banner);
  }, 50))));
</script>
</body>
</html>
